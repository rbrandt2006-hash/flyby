# Builds the Flyby frontend and deploys it to GitHub Pages on every push to main.
#
# The site is served at https://rbrandt2006-hash.github.io/flyby/
#
# IMPORTANT — the backend:
#   The built site is static; it can't run the Flask backend. It calls whatever
#   VITE_API_URL points at. Right now that's http://localhost:8659, so the
#   deployed site only works on a machine that's running `python main.py`
#   locally. When you host the backend, set a repository variable named
#   VITE_API_URL (Settings → Secrets and variables → Actions → Variables) to its
#   URL, e.g. https://api.yourdomain.com — no code change needed.
#
# One-time setup in the repo: Settings → Pages → Build and deployment →
# Source: "GitHub Actions".

name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Let a new deploy supersede an in-progress one, but don't cancel a run mid-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Backend the deployed site talks to: the AWS EC2 deployment behind
          # nginx + Certbot. Override by setting a VITE_API_URL repository
          # variable (Settings -> Secrets and variables -> Actions -> Variables).
          # NOTE: this origin must also be listed in index.html's CSP
          # connect-src, or the browser will block every API call.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://autonomous.opencodingsociety.com' }}
        run: npm run build

      - name: Add SPA fallback
        # GitHub Pages has no server-side routing, so a direct hit or refresh on
        # a client route (e.g. /flyby/trips) would 404. Serving index.html as
        # 404.html lets the app boot and React Router take over.
        run: cp dist/index.html dist/404.html

      - name: Disable Jekyll
        # Stop Pages' Jekyll from ignoring files that start with an underscore.
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
