# Builds the Flyby frontend and deploys it to GitHub Pages on every push to main.
#
# The site is served at https://rbrandt2006-hash.github.io/flyby/ and, once the
# custom domain is switched on in Settings -> Pages, at https://flybyai.net/
# (GitHub then sends the old github.io address there automatically).
#
# IMPORTANT — the backend:
#   The built site is static; it can't run the Flask backend. It calls whatever
#   VITE_API_URL points at. Right now that's http://localhost:8659, so the
#   deployed site only works on a machine that's running `python main.py`
#   locally. When you host the backend, set a repository variable named
#   VITE_API_URL (Settings → Secrets and variables → Actions → Variables) to its
#   URL, e.g. https://api.yourdomain.com — no code change needed.
#
# One-time setup in the repo: Settings → Pages → Build and deployment →
# Source: "GitHub Actions".

name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Let a new deploy supersede an in-progress one, but don't cancel a run mid-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Find where Pages serves the site
        # Tells the build its base path: "/flyby" on rbrandt2006-hash.github.io,
        # "" once a custom domain (flybyai.net) is set in Settings -> Pages.
        # So switching domains needs no code change, just a re-run of this
        # workflow right after saving the custom domain.
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          # Backend the deployed site talks to: the AWS EC2 deployment behind
          # nginx + Certbot. Override by setting a VITE_API_URL repository
          # variable (Settings -> Secrets and variables -> Actions -> Variables).
          # NOTE: this origin must also be listed in index.html's CSP
          # connect-src, or the browser will block every API call.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://hungerheros.opencodingsociety.com' }}
          # Path the site is served from, worked out by the step above:
          # "/flyby/" on rbrandt2006-hash.github.io, "/" on flybyai.net.
          # A VITE_BASE repository variable overrides it if ever needed.
          VITE_BASE: ${{ vars.VITE_BASE || format('{0}/', steps.pages.outputs.base_path) }}
        run: npm run build

      - name: Check the landing page and the app are both in place
        # The build itself (vite.config.ts, landing page plugin) writes:
        #   index.html  the landing page from landing/: what flybyai.net/ shows
        #   404.html    the React app. GitHub Pages has no server-side routing,
        #               so every other address (/get-started, /dashboard,
        #               /trips ...) gets 404.html and React Router takes over.
        # Don't copy index.html over 404.html here: that would replace the app
        # with the landing page on every address. Stop the deploy instead if
        # the app page is missing.
        run: |
          grep -q 'id="root"' dist/404.html || { echo "dist/404.html is not the app"; exit 1; }
          if grep -q 'id="root"' dist/index.html; then
            echo "Root page: the app (no landing/index.html in this build)"
          else
            echo "Root page: the landing page"
          fi

      - name: Disable Jekyll
        # Stop Pages' Jekyll from ignoring files that start with an underscore.
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
