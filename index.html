<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flyby AI</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <meta name="description" content="Flyby predicts, plans, and manages business travel automatically. Reduce manual booking, prevent disruptions, and automate expense tracking.">
    <meta name="author" content="flyby" />

    <!-- Open Graph -->
    
    
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://pub-bb2e103a32db4e198524a2e9ed8f35b4.r2.dev/797b2a42-4fc4-4e0d-b548-ccd8223de6a9/id-preview-4db2e7b1--2ec8592c-439a-4f2c-9f1e-5238e2d8a0fb.lovable.app-1773285206112.png">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@flyby" />
    <meta name="twitter:image" content="https://pub-bb2e103a32db4e198524a2e9ed8f35b4.r2.dev/797b2a42-4fc4-4e0d-b548-ccd8223de6a9/id-preview-4db2e7b1--2ec8592c-439a-4f2c-9f1e-5238e2d8a0fb.lovable.app-1773285206112.png">

    <!-- Security headers.
         Only `referrer` works as a meta tag. X-Frame-Options, X-Content-Type-Options
         and Permissions-Policy are ignored by browsers when set here — they have to
         arrive as real HTTP headers, so they are sent by the server instead:
         the Vite dev server (see server.headers in vite.config.ts) in development,
         and whatever serves `dist/` in production. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Content Security Policy -->
    <!-- Allows: self, inline styles/scripts (for Vite HMR), images from https, fonts.
         The Flyby backend is reached same-origin — the dev server proxies /api,
         /auth, /rest, /functions and /storage to it — so 'self' covers every API
         call. If you point VITE_API_URL at a backend on another host, add that
         origin to connect-src. -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      img-src 'self' data: blob: https: http://localhost:*;
      font-src 'self' https://fonts.gstatic.com;
      connect-src 'self';
      form-action 'self';
      base-uri 'self';
      object-src 'none';
      upgrade-insecure-requests;
    " />
    
    <meta property="og:title" content="Flyby AI">
  <meta name="twitter:title" content="Flyby AI">
  <meta property="og:description" content="Flyby predicts, plans, and manages business travel automatically. Reduce manual booking, prevent disruptions, and automate expense tracking.">
  <meta name="twitter:description" content="Flyby predicts, plans, and manages business travel automatically. Reduce manual booking, prevent disruptions, and automate expense tracking.">
</head>
